# Legacy checkout sample. Live user settings are stored in XDG config directories.
# Edit the user config, not this tracked example.
mode = "dev"
log_filter = "info"
prefer_dark_mode = true

[audio]
enabled = true
volume = 1.0
sample_rate_hz = 48000
mute_on_startup = false

[video]
fullscreen = false
integer_scale = true
scale = 3
vsync = true

[input]
active_device = "keyboard"

[input.keyboard_bindings]
up = "ArrowUp"
down = "ArrowDown"
left = "ArrowLeft"
right = "ArrowRight"
start = "Enter"
select = "Space"
a = "X"
b = "Z"
x = "S"
y = "A"
l = "Q"
r = "W"

[input.gamepad_bindings]
up = "DPadUp"
down = "DPadDown"
left = "DPadLeft"
right = "DPadRight"
start = "Start"
select = "Select"
a = "East"
b = "South"
x = "North"
y = "West"
l = "LeftTrigger"
r = "RightTrigger"

[cheats]
show_cheat_badges = false

[cheats.enabled_by_game]

[library]
rom_dirs = []
active_view = "grid"
show_installed_only = false

[advanced]
show_missing_games = true
refresh_on_startup = false

[advanced.providers]
enable_network = true
metadata_index_url = "https://api.github.com/repos/libretro-thumbnails/Nintendo_-_Super_Nintendo_Entertainment_System/git/trees/master?recursive=1"
cover_index_url = "https://raw.githubusercontent.com/libretro-thumbnails/Nintendo_-_Super_Nintendo_Entertainment_System/master"
cheat_index_url = "https://api.github.com/repos/libretro/libretro-database/git/trees/master?recursive=1"

[ui]
show_left_panel = true
show_right_panel = true
show_details_panel = true
show_log_panel = true
log_auto_scroll = true
left_panel_width = 280.0
library_panel_width = 420.0
details_panel_width = 340.0
right_panel_width = 320.0
log_panel_height = 180.0
