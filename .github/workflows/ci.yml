name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Rapid direct-to-main development can queue many superseded CI runs.
# Keep the newest result authoritative and avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Chrono diagnostic script syntax and CLI
        run: |
          python3 -m py_compile scripts/qa-chrono-usa.py
          python3 scripts/qa-chrono-usa.py --help
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev weston libgl1-mesa-dri libegl1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Bench Compile
        run: cargo bench -p starbyte-core --bench core_bootstrap --no-run --locked
      - name: Independent scheduler background-play smoke (no display server)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p starbyte-egui -- \
            --demo --scheduler-smoke \
            --config "$RUNNER_TEMP/starbyte-scheduler-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-scheduler-cache" \
            > "$RUNNER_TEMP/starbyte-scheduler-smoke.log" 2>&1 || {
              cat "$RUNNER_TEMP/starbyte-scheduler-smoke.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-scheduler-smoke.log"
          grep -F "STARBYTE_SCHEDULER_SMOKE_OK" "$RUNNER_TEMP/starbyte-scheduler-smoke.log"
      - name: Native Wayland demo smoke (virtual compositor)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p starbyte-egui --locked
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/starbyte-wayland"
          export WAYLAND_DISPLAY=wayland-starbyte
          export WINIT_UNIX_BACKEND=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            if ! kill -0 "$compositor" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.25
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          timeout 90s target/debug/starbyte-egui --demo --exit-after-frames 30 \
            --config "$RUNNER_TEMP/starbyte-ci-config.json" \
            --cache-dir "$RUNNER_TEMP/starbyte-ci-cache" \
            > "$RUNNER_TEMP/starbyte-wayland-smoke.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-wayland-smoke.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-wayland-smoke.log"
          grep -F "STARBYTE_NATIVE_SMOKE_OK frame=" "$RUNNER_TEMP/starbyte-wayland-smoke.log"
          # This acceptance shell consumes worker frames through egui while
          # executing game frames from a separate OS thread.
          timeout 90s target/debug/starbyte-egui --demo --threaded-preview --preview-background --exit-after-frames 30 \
            --config "$RUNNER_TEMP/starbyte-preview-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-preview-cache" \
            > "$RUNNER_TEMP/starbyte-threaded-preview.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-threaded-preview.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-threaded-preview.log"
          grep -F "STARBYTE_THREADED_PREVIEW_SMOKE_OK" "$RUNNER_TEMP/starbyte-threaded-preview.log"
