name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Rapid direct-to-main development can queue many superseded CI runs.
# Keep the newest result authoritative and avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bootless TCG/QMP hardware-model evidence; not guest DRM or native QA.
  virtual-device-models:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify headless model probe syntax
        run: bash -n scripts/qa-virtual-devices.sh
      - name: Reject interactive and self-hosted execution
        shell: bash
        run: |
          set -euo pipefail
          if output="$(DISPLAY=:0 bash scripts/qa-virtual-devices.sh --check-only 2>&1)"; then exit 1; fi
          grep -Fq 'STARBYTE_VIRTUAL_DEVICES_BLOCKED graphical_session_present' <<<"$output"
          if output="$(RUNNER_ENVIRONMENT=self-hosted bash scripts/qa-virtual-devices.sh --check-only 2>&1)"; then exit 1; fi
          grep -Fq 'STARBYTE_VIRTUAL_DEVICES_BLOCKED github_hosted_runner_only' <<<"$output"
          bash scripts/qa-virtual-devices.sh --check-only
      - name: Install headless QEMU and QMP utilities
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 socat jq
      - name: Instantiate virtual GPU and keyboard PCI device models
        run: bash scripts/qa-virtual-devices.sh --smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Check source layout before apt or Rust dependency installation:
      # formatter failures should surface early during rapid main updates.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Verify unattended physical-QA launcher syntax
        run: bash -n scripts/qa-native-hyprland.sh
      - name: Verify isolated QA launcher syntax
        run: bash -n scripts/qa-isolated-wayland.sh
      - name: Verify impossible nested startup fails before any side effect
        shell: bash
        run: |
          set -euo pipefail
          # This must work even with no bwrap, Weston or Hyprland installed:
          # fail from the pinned upstream allocator requirement before launch.
          if output="$(env -u XDG_RUNTIME_DIR bash scripts/qa-isolated-wayland.sh --hyprland-nested-smoke 2>&1)"; then
            echo "Unsafe nested compositor startup unexpectedly permitted" >&2
            exit 1
          fi
          grep -Fq 'STARBYTE_ISOLATED_WAYLAND_BLOCKED nested_hyprland_requires_private_drm_allocator' <<<"$output"
          if output="$(env -u XDG_RUNTIME_DIR bash scripts/qa-isolated-wayland.sh --hyprland-headless-smoke 2>&1)"; then
            echo "Unsafe headless compositor startup unexpectedly permitted" >&2
            exit 1
          fi
          grep -Fq 'STARBYTE_ISOLATED_WAYLAND_BLOCKED headless_hyprland_requires_private_drm_allocator' <<<"$output"
      - name: Verify unattended GUI QA is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          # No live compositor in hosted CI, yet both routes must refuse
          # execution BEFORE requesting any Wayland/Hyprland resources.
          for args in "" "--focused-only"; do
            if output="$(bash scripts/qa-native-hyprland.sh $args 2>&1)"; then
              echo "Unexpected physical QA execution permitted" >&2
              exit 1
            fi
            grep -Fq "STARBYTE_NATIVE_QA_BLOCKED owner_desktop_focus_must_not_be_stolen" <<<"$output"
          done
          if grep -Eq 'hyprctl[[:space:]]+dispatch|starbyte-native-qa[[:space:]]+--physical-workspace' scripts/qa-native-hyprland.sh; then
            echo "Unattended launcher contains a focus-changing action" >&2
            exit 1
          fi
      - name: Verify ephemeral local QA runner syntax
        run: bash -n scripts/qa-runner-ephemeral.sh
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libudev-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Chrono diagnostic script syntax and CLI
        run: |
          python3 -m py_compile scripts/qa-chrono-usa.py
          python3 scripts/qa-chrono-usa.py --help
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
  # The workspace uses Rust 2024 let-chains, stabilized in 1.88.
  # Test the declared compiler floor independently of current stable.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - name: Verify declared Rust 1.88 minimum
        run: cargo check --workspace --all-targets --locked
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libudev-dev libasound2-dev weston libgl1-mesa-dri libegl1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Bench Compile
        run: cargo bench -p starbyte-core --bench core_bootstrap --no-run --locked
      - name: Independent scheduler background-play smoke (no display server)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p starbyte-egui -- \
            --demo --scheduler-smoke \
            --config "$RUNNER_TEMP/starbyte-scheduler-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-scheduler-cache" \
            > "$RUNNER_TEMP/starbyte-scheduler-smoke.log" 2>&1 || {
              cat "$RUNNER_TEMP/starbyte-scheduler-smoke.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-scheduler-smoke.log"
          grep -F "STARBYTE_SCHEDULER_SMOKE_OK" "$RUNNER_TEMP/starbyte-scheduler-smoke.log"
      - name: Native Wayland demo smoke (virtual compositor)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p starbyte-egui --locked
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/starbyte-wayland"
          export WAYLAND_DISPLAY=wayland-starbyte
          export WINIT_UNIX_BACKEND=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            if ! kill -0 "$compositor" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.25
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          timeout 90s target/debug/starbyte-egui --demo --exit-after-frames 30 \
            --config "$RUNNER_TEMP/starbyte-ci-config.json" \
            --cache-dir "$RUNNER_TEMP/starbyte-ci-cache" \
            > "$RUNNER_TEMP/starbyte-wayland-smoke.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-wayland-smoke.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-wayland-smoke.log"
          grep -F "STARBYTE_NATIVE_SMOKE_OK frame=" "$RUNNER_TEMP/starbyte-wayland-smoke.log"
          # The *original* full-library egui shell can optionally consume
          # independently produced SNES frames. This remains opt-in until
          # every existing menu/save/audio action completes its handoff.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-frames 30 \
            --config "$RUNNER_TEMP/starbyte-full-worker-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-worker-cache" \
            > "$RUNNER_TEMP/starbyte-full-worker.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-worker.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-worker.log"
          grep -F "STARBYTE_FULL_LIBRARY_WORKER_SMOKE_OK frame=" "$RUNNER_TEMP/starbyte-full-worker.log"
          # A real original eframe paint must be backed by exactly one
          # emulator owner. Worker preview must have no shadow legacy session.
          grep -F "STARBYTE_FULL_LIBRARY_SINGLE_OWNER_SMOKE_OK legacy_session_absent=true worker_frame=" "$RUNNER_TEMP/starbyte-full-worker.log"
          # Exercise the original window's worker-owned quick save, quick
          # restore, durable-slot save and durable-slot restore on real Weston.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-saves \
            --config "$RUNNER_TEMP/starbyte-full-save-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-save-cache" \
            > "$RUNNER_TEMP/starbyte-full-save.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-save.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-save.log"
          grep -F "STARBYTE_FULL_LIBRARY_SAVE_SMOKE_OK frame=" "$RUNNER_TEMP/starbyte-full-save.log"
          # The complete original window must not control emulation time:
          # withhold all egui callbacks for two seconds, confirm the worker
          # completes at least 45 independent frames on native Weston.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-no-redraw \
            --config "$RUNNER_TEMP/starbyte-full-no-redraw-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-no-redraw-cache" \
            > "$RUNNER_TEMP/starbyte-full-no-redraw.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-no-redraw.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-no-redraw.log"
          grep -F "STARBYTE_FULL_LIBRARY_NO_REPAINT_GAP_BEGIN frame=" "$RUNNER_TEMP/starbyte-full-no-redraw.log"
          grep -F "STARBYTE_FULL_LIBRARY_NO_REPAINT_SMOKE_OK advanced_frames=" "$RUNNER_TEMP/starbyte-full-no-redraw.log"
          # Measure worker-produced frames per real elapsed second without
          # egui callbacks. This is virtual-Weston pacing evidence, not
          # physical Hyprland/GPU-present timing or speaker verification.
          grep -F "STARBYTE_FULL_LIBRARY_CLOCK_PACING_SMOKE_OK advanced_frames=" "$RUNNER_TEMP/starbyte-full-no-redraw.log"
          # The complementary policy case: pause the actual owner on focus
          # loss, withhold egui callbacks for two seconds, then resume without
          # a catch-up burst. This does not require a physical Hyprland session.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-focus-pause \
            --config "$RUNNER_TEMP/starbyte-full-focus-pause-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-focus-pause-cache" \
            > "$RUNNER_TEMP/starbyte-full-focus-pause.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-focus-pause.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-focus-pause.log"
          grep -F "STARBYTE_FULL_LIBRARY_FOCUS_PAUSE_SMOKE_OK paused_frames=" "$RUNNER_TEMP/starbyte-full-focus-pause.log"
          # Inject a panic only in the exclusive emulator owner and require
          # the complete original window to report its termination once.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-panic \
            --config "$RUNNER_TEMP/starbyte-full-worker-exit-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-worker-exit-cache" \
            > "$RUNNER_TEMP/starbyte-full-worker-exit.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-worker-exit.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-worker-exit.log"
          grep -F "STARBYTE_FULL_LIBRARY_WORKER_EXIT_SMOKE_OK playback_stopped=true" "$RUNNER_TEMP/starbyte-full-worker-exit.log"
          # Keep every user-data namespace disposable, then close the actual
          # full-library app process after its worker writes battery SRAM.
          export HOME="$RUNNER_TEMP/starbyte-sram-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/starbyte-sram-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/starbyte-sram-data"
          export XDG_STATE_HOME="$RUNNER_TEMP/starbyte-sram-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/starbyte-sram-xdg-cache"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-sram \
            --config "$RUNNER_TEMP/starbyte-full-sram-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-sram-cache" \
            > "$RUNNER_TEMP/starbyte-full-sram.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-sram.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-sram.log"
          grep -F "STARBYTE_FULL_LIBRARY_SRAM_SMOKE_OK persisted_byte=5A" "$RUNNER_TEMP/starbyte-full-sram.log"
          grep -F "STARBYTE_FULL_LIBRARY_OWNER_SHUTDOWN_SMOKE_OK finalized=true audio_released=true" "$RUNNER_TEMP/starbyte-full-sram.log"
          # Start a fresh starbyte-egui process with the same isolated XDG
          # data root. It reconstructs the battery demo and independently
          # verifies SRAM after the writer process and owner have exited.
          timeout 30s target/debug/starbyte-egui --demo --verify-demo-sram-restart \
            --config "$RUNNER_TEMP/starbyte-full-sram-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-sram-cache" \
            > "$RUNNER_TEMP/starbyte-full-sram-restart.log" 2>&1 || {
              cat "$RUNNER_TEMP/starbyte-full-sram-restart.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-sram-restart.log"
          grep -F "STARBYTE_FULL_LIBRARY_SRAM_RESTART_OK persisted_byte=5A" "$RUNNER_TEMP/starbyte-full-sram-restart.log"
          # A broken replacement request must report its error while keeping
          # the previous installed cartridge, generation and clock alive in
          # the original full-library window, not only in a worker unit test.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-replacement \
            --config "$RUNNER_TEMP/starbyte-full-replacement-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-replacement-cache" \
            > "$RUNNER_TEMP/starbyte-full-replacement.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-replacement.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-replacement.log"
          grep -F "STARBYTE_FULL_LIBRARY_REPLACEMENT_SMOKE_OK retained_rom=true advanced_frames=" "$RUNNER_TEMP/starbyte-full-replacement.log"
          # A failed replacement must not discard the old cartridge's
          # asynchronous screenshot PNG or its paused single-step texture.
          grep -F "STARBYTE_FULL_LIBRARY_RECEIPT_RACE_SMOKE_OK retained_rom=true screenshot_written=true step_uploaded=true pending_step_cleared=true" "$RUNNER_TEMP/starbyte-full-replacement.log"
          # A superseded launch can still install a cartridge before a
          # newer invalid request fails. Its success must update the
          # original window's owner generation and controls, not be lost.
          grep -F "STARBYTE_FULL_LIBRARY_SUPERSEDED_INSTALL_SMOKE_OK active_owner_synced=true newer_failure_reported=true" "$RUNNER_TEMP/starbyte-full-replacement.log"
          # Press F5, F8, F9 and Escape through the original window's egui
          # key-event pipeline. Verify saves, restore, library navigation,
          # continued worker progress and fresh video after returning.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-shortcuts \
            --config "$RUNNER_TEMP/starbyte-full-shortcuts-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-shortcuts-cache" \
            > "$RUNNER_TEMP/starbyte-full-shortcuts.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-shortcuts.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-shortcuts.log"
          grep -F "STARBYTE_FULL_LIBRARY_SHORTCUT_SMOKE_OK f5=true f8=true f9=true escape=true frame=" "$RUNNER_TEMP/starbyte-full-shortcuts.log"
          # In that same native original window, toggle menu/recent/status
          # visibility and individual FPS/sound/frame metrics. The library
          # must keep drawing, recent cards must render, and the worker must
          # continue while the shell panels are hidden and restored.
          grep -F "STARBYTE_FULL_LIBRARY_SHELL_SMOKE_OK menu=true recent_cards=true cover_texture=true library=true status_metrics=true view_toggles=true" "$RUNNER_TEMP/starbyte-full-shortcuts.log"
          # Original-window sound-mode changes must preserve separate disk
          # slot namespaces and restore the correct persistent slot on return.
          timeout 90s target/debug/starbyte-egui --demo --native-worker-preview --exit-after-full-worker-modes \
            --config "$RUNNER_TEMP/starbyte-full-modes-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-full-modes-cache" \
            > "$RUNNER_TEMP/starbyte-full-modes.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-full-modes.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-full-modes.log"
          grep -F "STARBYTE_FULL_LIBRARY_MODE_SMOKE_OK persistent_slot=true compatibility_slot=true separate_slots=true" "$RUNNER_TEMP/starbyte-full-modes.log"
          # This acceptance shell consumes worker frames through egui while
          # executing game frames from a separate OS thread.
          timeout 90s target/debug/starbyte-egui --demo --threaded-preview --preview-background --exit-after-frames 30 \
            --config "$RUNNER_TEMP/starbyte-preview-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-preview-cache" \
            > "$RUNNER_TEMP/starbyte-threaded-preview.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-threaded-preview.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-threaded-preview.log"
          grep -F "STARBYTE_THREADED_PREVIEW_SMOKE_OK" "$RUNNER_TEMP/starbyte-threaded-preview.log"
          # Launch the worker-backed library without a startup ROM and prove
          # that the virtual Wayland shell indexes the installed demo file.
          # The demo fixture was written by the legacy native smoke above.
          timeout 90s target/debug/starbyte-egui --threaded-preview --exit-after-library-scan \
            --rom-dir "$RUNNER_TEMP/starbyte-ci-cache/built-in" \
            --config "$RUNNER_TEMP/starbyte-library-smoke-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-library-smoke-cache" \
            > "$RUNNER_TEMP/starbyte-threaded-library.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-threaded-library.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-threaded-library.log"
          grep -F "STARBYTE_THREADED_LIBRARY_SMOKE_OK installed=" "$RUNNER_TEMP/starbyte-threaded-library.log"
          # Stronger native acceptance: select the installed demo *through
          # the library UI coordinator*, launch it on the owner worker and
          # require a real egui texture from the worker's completed frame.
          timeout 90s target/debug/starbyte-egui --threaded-preview --preview-background --exit-after-library-play \
            --rom-dir "$RUNNER_TEMP/starbyte-ci-cache/built-in" \
            --config "$RUNNER_TEMP/starbyte-library-play-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-library-play-cache" \
            > "$RUNNER_TEMP/starbyte-threaded-library-play.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-threaded-library-play.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-threaded-library-play.log"
          grep -F "STARBYTE_THREADED_LIBRARY_PLAY_SMOKE_OK" "$RUNNER_TEMP/starbyte-threaded-library-play.log"
          # Withhold native egui callbacks for two seconds while requiring
          # substantial progress on the same independent SNES worker clock.
          timeout 90s target/debug/starbyte-egui --demo --threaded-preview --preview-background --exit-after-repaint-gap \
            --config "$RUNNER_TEMP/starbyte-no-redraw-config.toml" \
            --cache-dir "$RUNNER_TEMP/starbyte-no-redraw-cache" \
            > "$RUNNER_TEMP/starbyte-no-redraw.log" 2>&1 || {
              cat "$RUNNER_TEMP/weston.log"
              cat "$RUNNER_TEMP/starbyte-no-redraw.log"
              exit 1
            }
          cat "$RUNNER_TEMP/starbyte-no-redraw.log"
          grep -F "STARBYTE_NO_REPAINT_SMOKE_OK advanced_frames=" "$RUNNER_TEMP/starbyte-no-redraw.log"
