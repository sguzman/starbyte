name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve checked-in lockfile additions
        run: cargo fetch
      - name: Export resolved Cargo lock
        uses: actions/upload-artifact@v4
        with:
          name: starbyte-resolved-cargo-lock
          path: Cargo.lock
          retention-days: 1
      # One-shot publishing step. Remove immediately after the generated
      # audio dependency lockfile has been committed.
      - name: Persist Cargo-generated audio lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'build: persist generated audio lockfile'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock Cargo audio dependencies'
            git push origin HEAD:main
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Bench Compile
        run: cargo bench -p starbyte-core --bench core_bootstrap --no-run
