name: Format Cheatarium adapter

on:
  push:
    branches: [main]
    paths:
      - 'crates/starbyte-cli/src/cheatarium.rs'
      - 'crates/starbyte-cli/src/main.rs'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit normalized Rust formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/starbyte-cli/src
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Cheatarium integration'
            git push origin HEAD:main
          fi
