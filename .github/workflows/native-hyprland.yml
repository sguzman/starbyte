name: native Hyprland acceptance

# Only a trusted main-branch marker commit or an authorized dispatch may
# touch the owner's interactive desktop. Public PRs do not run here.
on:
  push:
    branches: [main]
    paths:
      - .github/native-qa-dispatch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starbyte-native-hyprland
  cancel-in-progress: false

jobs:
  physical:
    if: github.repository == 'sguzman/starbyte'
    runs-on: [self-hosted, linux, x64, hyprland]
    timeout-minutes: 30
    steps:
      - name: Checkout the requested trusted revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run physical workspace acceptance
        shell: bash
        run: bash scripts/qa-native-hyprland.sh
