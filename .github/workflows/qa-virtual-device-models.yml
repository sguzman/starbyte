name: qa-virtual-device-models

on:
  push:
    branches: [main]
    paths:
      - "scripts/qa-virtual-devices.sh"
      - "scripts/qa-guest-linux.sh"
      - "scripts/qa-guest-gbm.rs"
      - "scripts/qa-guest-input.rs"
      - "scripts/qa-guest-wayland-wire.rs"
      - ".github/workflows/qa-virtual-device-models.yml"
  pull_request:
    paths:
      - "scripts/qa-virtual-devices.sh"
      - "scripts/qa-guest-linux.sh"
      - "scripts/qa-guest-gbm.rs"
      - "scripts/qa-guest-input.rs"
      - "scripts/qa-guest-wayland-wire.rs"
      - ".github/workflows/qa-virtual-device-models.yml"

# QEMU packages are heavyweight. Never repeat this probe on unrelated
# Starbyte gameplay/audio changes. Cancel superseded same-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bootless TCG/QMP hardware-model evidence; not guest DRM or native QA.
  virtual-device-models:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify headless model probe syntax
        run: bash -n scripts/qa-virtual-devices.sh
      - name: Reject interactive and self-hosted execution
        shell: bash
        run: |
          set -euo pipefail
          if output="$(DISPLAY=:0 bash scripts/qa-virtual-devices.sh --check-only 2>&1)"; then exit 1; fi
          grep -Fq 'STARBYTE_VIRTUAL_DEVICES_BLOCKED graphical_session_present' <<<"$output"
          if output="$(RUNNER_ENVIRONMENT=self-hosted bash scripts/qa-virtual-devices.sh --check-only 2>&1)"; then exit 1; fi
          grep -Fq 'STARBYTE_VIRTUAL_DEVICES_BLOCKED github_hosted_runner_only' <<<"$output"
          bash scripts/qa-virtual-devices.sh --check-only
      - name: Check private Linux guest probe safety
        shell: bash
        run: |
          bash -n scripts/qa-guest-linux.sh
          if output="$(DISPLAY=:0 bash scripts/qa-guest-linux.sh --check-only 2>&1)"; then exit 1; fi
          grep -Fq 'STARBYTE_GUEST_LINUX_BLOCKED graphical_session_present' <<<"$output"
          bash scripts/qa-guest-linux.sh --check-only
      - name: Install headless QEMU and QMP utilities
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 socat jq
      - name: Instantiate virtual GPU and keyboard PCI device models
        run: bash scripts/qa-virtual-devices.sh --smoke
      - name: Install static BusyBox, SquashFS and module tools
        run: sudo apt-get install -y --no-install-recommends busybox-static cpio curl squashfs-tools kmod
      - name: Install Rust and GBM host-side compilation dependencies
        uses: dtolnay/rust-toolchain@stable
      - name: Install GBM and CPU-only Mesa software renderer
        run: sudo apt-get install -y --no-install-recommends libgbm-dev libdrm-dev libgl1-mesa-dri
      - name: Install DRM Wayland compositor and ELF diagnostics
        run: sudo apt-get install -y --no-install-recommends weston wayland-utils libseat1 libinput10 binutils udev
      - name: Validate guest Wayland registry barrier and compositor/input globals
        run: bash scripts/qa-guest-linux.sh --wayland-smoke
      - name: Boot private Linux kernel and validate guest PCI devices
        run: bash scripts/qa-guest-linux.sh --smoke
      - name: Initialize guest virtio DRM and input devices
        run: bash scripts/qa-guest-linux.sh --driver-smoke
      - name: Probe guest GBM allocator and rendering buffer
        run: bash scripts/qa-guest-linux.sh --gbm-smoke
      - name: Inject private QMP key and verify guest evdev delivery
        run: bash scripts/qa-guest-linux.sh --input-smoke
