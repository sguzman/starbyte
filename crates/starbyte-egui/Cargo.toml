[package]
name = "starbyte-egui"
default-run = "starbyte-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "starbyte-egui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.32.3"
gilrs = "0.11.0"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15.4"
serde_json = "1.0.150"
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
starbyte-core = { path = "../starbyte-core" }
starbyte-frontend = { path = "../starbyte-frontend" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# The winit Wayland raw-display handle reaches Mesa/Glutin EGL as a native
# wl_display pointer. The pure-Rust wayland-backend uses an incompatible
# object-ID pointer; select the real libwayland-client backend on Linux.
# dlopen keeps the Wayland client library optional for X11 fallback.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "=0.3.15", features = ["client_system", "dlopen"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
